name: Update Shopify RSS Feed

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate RSS and Catalog feeds
        run: |
          python3 <<'PY'
          import hashlib
          import html
          import json
          import mimetypes
          import re
          import time
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from email.utils import format_datetime
          from xml.sax.saxutils import escape
          from xml.etree import ElementTree as ET

          SHOPIFY_STORE = "https://rawayatluxe.com"

          CURRENCY = "PKR"
          BRAND = "Rawayat"
          STORE_NAME = "Rawayat Luxe"

          PIN_TITLE_MAX = 100
          PIN_DESCRIPTION_MAX = 790
          CATALOG_TITLE_MAX = 500
          CATALOG_DESCRIPTION_MAX = 10000

          def fetch_json(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Rawayat-Pinterest-Catalog/3.0"
                  }
              )
              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:
                  return json.load(response)

          def clean_text(value):
              if not value:
                  return ""

              if isinstance(value, list):
                  value = " ".join(
                      str(item)
                      for item in value
                  )

              value = str(value)
              value = html.unescape(value)

              value = re.sub(
                  r"<(script|style).*?>.*?</\1>",
                  " ",
                  value,
                  flags=re.I | re.S
              )

              value = re.sub(
                  r"<[^>]+>",
                  " ",
                  value
              )

              value = " ".join(
                  value.split()
              )

              return value.strip()

          def normalize_tags(value):
              if isinstance(value, list):
                  return " ".join(
                      str(item)
                      for item in value
                  )

              return str(value or "")

          def determine_category(product):
              title = clean_text(
                  product.get("title", "")
              ).lower()

              product_type = clean_text(
                  product.get("product_type", "")
              ).lower()

              tags = normalize_tags(
                  product.get("tags", "")
              ).lower()

              combined = " ".join([
                  title,
                  product_type,
                  tags
              ])

              category_rules = [
                  (
                      [
                          "bridal",
                          "bride",
                          "walima",
                          "mehndi"
                      ],
                      "BRI"
                  ),
                  (
                      [
                          "unstitched",
                          "un-stitched",
                          "un stitched"
                      ],
                      "UNS"
                  ),
                  (
                      [
                          "lawn",
                          "summer"
                      ],
                      "LAW"
                  ),
                  (
                      [
                          "formal",
                          "formals",
                          "evening"
                      ],
                      "FOR"
                  ),
                  (
                      [
                          "party",
                          "partywear",
                          "party wear"
                      ],
                      "PAR"
                  ),
                  (
                      [
                          "casual"
                      ],
                      "CAS"
                  ),
                  (
                      [
                          "luxury"
                      ],
                      "LUX"
                  )
              ]

              for keywords, code in category_rules:
                  for keyword in keywords:
                      if keyword in combined:
                          return code

              # Useful fallback for richly embroidered Pakistani occasion wear.
              premium_terms = [
                  "velvet",
                  "tissue",
                  "organza",
                  "chiffon",
                  "raw silk",
                  "khaddar",
                  "embellished",
                  "embroidered"
              ]

              if any(
                  term in combined
                  for term in premium_terms
              ):
                  return "FOR"

              return "FAS"

          def fashion_term(category):
              return {
                  "BRI": "Pakistani women's bridal wear",
                  "UNS": "Pakistani women's unstitched suits",
                  "LAW": "Pakistani women's lawn fashion",
                  "FOR": "Pakistani women's formal wear",
                  "PAR": "Pakistani women's party wear",
                  "CAS": "Pakistani women's casual fashion",
                  "LUX": "Pakistani women's luxury fashion",
                  "FAS": "Pakistani women's fashion"
              }.get(
                  category,
                  "Pakistani women's fashion"
              )

          def short_category_name(category):
              return {
                  "BRI": "Pakistani Bridal Wear",
                  "UNS": "Pakistani Unstitched Wear",
                  "LAW": "Pakistani Lawn Fashion",
                  "FOR": "Pakistani Formal Wear",
                  "PAR": "Pakistani Party Wear",
                  "CAS": "Pakistani Casual Fashion",
                  "LUX": "Pakistani Luxury Fashion",
                  "FAS": "Pakistani Fashion"
              }.get(
                  category,
                  "Pakistani Fashion"
              )

          def product_type_label(category):
              return {
                  "BRI": "Women's Clothing > Pakistani Bridal Wear",
                  "UNS": "Women's Clothing > Pakistani Unstitched Suits",
                  "LAW": "Women's Clothing > Pakistani Lawn",
                  "FOR": "Women's Clothing > Pakistani Formal Wear",
                  "PAR": "Women's Clothing > Pakistani Party Wear",
                  "CAS": "Women's Clothing > Pakistani Casual Wear",
                  "LUX": "Women's Clothing > Pakistani Luxury Fashion",
                  "FAS": "Women's Clothing > Pakistani Fashion"
              }.get(
                  category,
                  "Women's Clothing > Pakistani Fashion"
              )

          def google_product_category(product):
              title = clean_text(
                  product.get("title", "")
              ).lower()

              product_type = clean_text(
                  product.get("product_type", "")
              ).lower()

              tags = normalize_tags(
                  product.get("tags", "")
              ).lower()

              combined = " ".join([
                  title,
                  product_type,
                  tags
              ])

              if "dress" in combined and "suit" not in combined:
                  return (
                      "Apparel & Accessories > "
                      "Clothing > Dresses"
                  )

              if "lehenga" in combined:
                  return (
                      "Apparel & Accessories > "
                      "Clothing > Traditional & "
                      "Ceremonial Clothing > Saris & Lehengas"
                  )

              return (
                  "Apparel & Accessories > "
                  "Clothing > Traditional & "
                  "Ceremonial Clothing"
              )

          def generate_temporary_sku(
              product,
              used_skus
          ):
              product_id = str(
                  product.get("id", "")
              )

              category = determine_category(
                  product
              )

              if not product_id:
                  product_id = "0000"

              number = product_id[-4:].zfill(4)

              base = (
                  f"RAW-{category}-{number}"
              )

              sku = base
              counter = 2

              while sku in used_skus:
                  sku = (
                      f"{base}-{counter}"
                  )
                  counter += 1

              used_skus.add(sku)

              return sku

          def get_existing_sku(variants):
              for variant in variants:
                  sku = (
                      variant.get("sku")
                      or ""
                  )

                  if isinstance(sku, list):
                      sku = " ".join(
                          str(item)
                          for item in sku
                      )

                  sku = str(sku).strip()

                  if sku:
                      return sku

              return ""

          def extract_colors(description):
              colors = []

              matches = re.findall(
                  r"\bColor:\s*"
                  r"([A-Za-z][A-Za-z\s/&-]{1,30}?)"
                  r"(?=\s+Fabric:"
                  r"|\s+Work Details:"
                  r"|\s+Model\b"
                  r"|\s+Note:"
                  r"|$)",
                  description,
                  flags=re.I
              )

              for value in matches:
                  color = clean_text(value)

                  if not color:
                      continue

                  if color.lower() not in [
                      item.lower()
                      for item in colors
                  ]:
                      colors.append(color)

              return colors[:3]

          FABRIC_TERMS = [
              "tropical slub khaddar",
              "zari tissue",
              "medium silk",
              "raw silk",
              "georgette",
              "organza",
              "chiffon",
              "velvet",
              "lawn",
              "linen",
              "cambric",
              "cotton",
              "khaddar",
              "karandi",
              "viscose",
              "jacquard",
              "satin",
              "crepe",
              "chanderi",
              "net",
              "silk"
          ]

          def extract_fabrics(product, description):
              combined = " ".join([
                  clean_text(
                      product.get("title", "")
                  ),
                  description
              ]).lower()

              fabrics = []

              for fabric in FABRIC_TERMS:
                  if fabric in combined:
                      if fabric not in [
                          item.lower()
                          for item in fabrics
                      ]:
                          fabrics.append(
                              fabric.title()
                          )

              return fabrics[:3]

          def extract_attributes(
              product,
              description
          ):
              colors = extract_colors(
                  description
              )

              fabrics = extract_fabrics(
                  product,
                  description
              )

              return colors, fabrics

          def trim_text(
              text,
              max_chars
          ):
              text = clean_text(text)

              if len(text) <= max_chars:
                  return text

              cut = text[:max_chars]

              boundary_candidates = [
                  cut.rfind(". "),
                  cut.rfind("! "),
                  cut.rfind("? ")
              ]

              boundary = max(
                  boundary_candidates
              )

              if boundary >= int(
                  max_chars * 0.60
              ):
                  return (
                      cut[:boundary + 1]
                  )

              return (
                  cut.rstrip(
                      " ,;:-"
                  )
                  + "."
              )

          def image_view_label(
              image_url,
              image_index
          ):
              path = urllib.parse.urlparse(
                  image_url
              ).path

              filename = path.rsplit(
                  "/",
                  1
              )[-1]

              stem = re.sub(
                  r"\.[A-Za-z0-9]+$",
                  "",
                  filename
              )

              match = re.search(
                  r"(?:[-_ ])([A-Za-z])(?:_\d+)?$",
                  stem
              )

              if match:
                  return (
                      "View "
                      + match.group(1).upper()
                  )

              return (
                  f"View {image_index}"
              )

          def build_pinterest_title(
              product,
              description,
              image_url,
              image_index
          ):
              original_title = clean_text(
                  product.get("title", "")
              )

              if not original_title:
                  original_title = (
                      "Pakistani Fashion"
                  )

              category = determine_category(
                  product
              )

              colors, _ = extract_attributes(
                  product,
                  description
              )

              color = (
                  colors[0]
                  if colors
                  else ""
              )

              view = image_view_label(
                  image_url,
                  image_index
              )

              category_term = (
                  short_category_name(
                      category
                  )
              )

              vendor = clean_text(
                  product.get(
                      "vendor",
                      BRAND
                  )
              )

              parts = [
                  original_title
              ]

              if color:
                  parts.append(color)

              parts.append(category_term)
              parts.append(view)

              if (
                  vendor
                  and vendor.lower()
                  != BRAND.lower()
              ):
                  parts.append(vendor)

              candidates = [
                  " | ".join(parts),
                  " | ".join([
                      original_title,
                      color,
                      category_term,
                      view
                  ]),
                  " | ".join([
                      original_title,
                      color,
                      view
                  ]),
                  " | ".join([
                      original_title,
                      view
                  ])
              ]

              for candidate in candidates:
                  candidate = " | ".join([
                      item
                      for item in candidate.split(
                          " | "
                      )
                      if item
                  ])

                  if len(candidate) <= PIN_TITLE_MAX:
                      return candidate

              return (
                  original_title[:(
                      PIN_TITLE_MAX
                      - len(view)
                      - 3
                  )].rstrip()
                  + " | "
                  + view
              )

          def build_pinterest_description(
              product,
              original_description,
              image_url,
              image_index
          ):
              title = clean_text(
                  product.get("title", "")
              )

              if not title:
                  title = (
                      "Pakistani Fashion"
                  )

              category = determine_category(
                  product
              )

              colors, fabrics = (
                  extract_attributes(
                      product,
                      original_description
                  )
              )

              view = image_view_label(
                  image_url,
                  image_index
              )

              parts = [
                  f"{view} of {title}."
              ]

              if colors:
                  parts.append(
                      "Colour: "
                      + ", ".join(colors[:2])
                      + "."
                  )

              if fabrics:
                  parts.append(
                      "Fabric: "
                      + ", ".join(fabrics[:2])
                      + "."
                  )

              parts.append(
                  f"A {fashion_term(category)} "
                  f"look from {STORE_NAME}, "
                  f"featuring detailed Pakistani "
                  f"craftsmanship."
              )

              if original_description:
                  parts.append(
                      trim_text(
                          original_description,
                          560
                      )
                  )

              parts.append(
                  "Shop Rawayat Luxe online for "
                  "Pakistani fashion with worldwide "
                  "availability."
              )

              description = " ".join(parts)

              return trim_text(
                  description,
                  PIN_DESCRIPTION_MAX
              )

          def build_catalog_description(
              product,
              original_description
          ):
              title = clean_text(
                  product.get("title", "")
              ) or "Pakistani Fashion"

              category = determine_category(
                  product
              )

              colors, fabrics = (
                  extract_attributes(
                      product,
                      original_description
                  )
              )

              parts = [
                  title + "."
              ]

              if colors:
                  parts.append(
                      "Colour: "
                      + ", ".join(colors)
                      + "."
                  )

              if fabrics:
                  parts.append(
                      "Fabric: "
                      + ", ".join(fabrics)
                      + "."
                  )

              term = fashion_term(category)
              term = re.sub(
                  r"^Pakistani women's\s+",
                  "",
                  term,
                  flags=re.I
              )

              parts.append(
                  f"Pakistani women's {term} "
                  f"from {STORE_NAME}."
              )

              if original_description:
                  parts.append(
                      original_description
                  )

              parts.append(
                  "Worldwide availability."
              )

              return trim_text(
                  " ".join(parts),
                  CATALOG_DESCRIPTION_MAX
              )

          def is_preorder(product):
              tags = normalize_tags(
                  product.get("tags", "")
              ).lower()

              title = clean_text(
                  product.get("title", "")
              ).lower()

              combined = (
                  tags
                  + " "
                  + title
              )

              preorder_terms = [
                  "pre-order",
                  "preorder",
                  "pre order"
              ]

              return any(
                  term in combined
                  for term in preorder_terms
              )

          def format_rss_date(value):
              if not value:
                  return format_datetime(
                      datetime.now(
                          timezone.utc
                      ),
                      usegmt=True
                  )

              try:
                  parsed = datetime.fromisoformat(
                      str(value).replace(
                          "Z",
                          "+00:00"
                      )
                  )

                  if parsed.tzinfo is None:
                      parsed = parsed.replace(
                          tzinfo=timezone.utc
                      )

                  return format_datetime(
                      parsed,
                      usegmt=False
                  )

              except Exception:
                  return format_datetime(
                      datetime.now(
                          timezone.utc
                      ),
                      usegmt=True
                  )

          image_metadata_cache = {}

          def get_image_metadata(
              image_url
          ):
              if image_url in (
                  image_metadata_cache
              ):
                  return image_metadata_cache[
                      image_url
                  ]

              parsed = urllib.parse.urlparse(
                  image_url
              )

              mime_type = (
                  mimetypes.guess_type(
                      parsed.path
                  )[0]
                  or "image/jpeg"
              )

              content_length = ""

              try:
                  request = urllib.request.Request(
                      image_url,
                      method="HEAD",
                      headers={
                          "User-Agent":
                              "Rawayat-Pinterest-Catalog/3.0"
                      }
                  )

                  with urllib.request.urlopen(
                      request,
                      timeout=15
                  ) as response:
                      raw_length = (
                          response.headers.get(
                              "Content-Length"
                          )
                      )

                      if raw_length:
                          content_length = str(
                              int(raw_length)
                          )

                      header_type = (
                          response.headers.get(
                              "Content-Type"
                          )
                      )

                      if header_type:
                          header_type = (
                              header_type.split(
                                  ";",
                                  1
                              )[0].strip()
                          )

                          if header_type.startswith(
                              "image/"
                          ):
                              mime_type = (
                                  header_type
                              )

              except Exception as error:
                  print(
                      "Image HEAD request failed:",
                      image_url,
                      "->",
                      error
                  )

              metadata = (
                  content_length,
                  mime_type
              )

              image_metadata_cache[
                  image_url
              ] = metadata

              return metadata

          products = []
          since_id = None

          while True:
              query = {
                  "limit": "250"
              }

              if since_id:
                  query[
                      "since_id"
                  ] = str(since_id)

              query_string = (
                  urllib.parse.urlencode(
                      query
                  )
              )

              url = (
                  SHOPIFY_STORE
                  + "/products.json?"
                  + query_string
              )

              page = fetch_json(url)

              page_products = page.get(
                  "products",
                  []
              )

              if not page_products:
                  break

              products.extend(
                  page_products
              )

              last_id = (
                  page_products[-1].get(
                      "id"
                  )
              )

              if not last_id:
                  break

              if len(page_products) < 250:
                  break

              if since_id == last_id:
                  break

              since_id = last_id

              time.sleep(1)

          print(
              f"Retrieved {len(products)} Shopify products."
          )

          used_skus = set()

          # Preserve all existing Shopify SKUs first.
          for product in products:
              variants = product.get(
                  "variants",
                  []
              )

              existing_sku = (
                  get_existing_sku(
                      variants
                  )
              )

              if existing_sku:
                  used_skus.add(
                      existing_sku
                  )

          rss_items = []
          catalog_items = []

          for product in products:
              title = clean_text(
                  product.get("title", "")
              )

              handle = (
                  product.get(
                      "handle",
                      ""
                  )
                  or ""
              )

              if not handle:
                  print(
                      "Skipping product without handle:",
                      title
                  )
                  continue

              product_id = str(
                  product.get(
                      "id",
                      ""
                  )
              )

              product_url = (
                  SHOPIFY_STORE
                  + "/products/"
                  + handle
              )

              raw_description = (
                  product.get(
                      "body_html",
                      ""
                  )
              )

              description = clean_text(
                  raw_description
              )

              images = product.get(
                  "images",
                  []
              )

              variants = product.get(
                  "variants",
                  []
              )

              if not images:
                  print(
                      "Skipping product without images:",
                      title
                  )
                  continue

              existing_sku = (
                  get_existing_sku(
                      variants
                  )
              )

              if existing_sku:
                  sku = existing_sku
                  sku_source = "Shopify"
              else:
                  sku = generate_temporary_sku(
                      product,
                      used_skus
                  )
                  sku_source = "temporary"

              print(
                  f"{title} -> "
                  f"{sku} ({sku_source})"
              )

              published = (
                  product.get(
                      "published_at"
                  )
                  or datetime.now(
                      timezone.utc
                  ).isoformat()
              )

              published_rss_date = (
                  format_rss_date(
                      published
                  )
              )

              seen_images = set()

              # One RSS item per unique product image.
              for image_index, image in enumerate(
                  images,
                  start=1
              ):
                  image_url = (
                      image.get(
                          "src",
                          ""
                      )
                  )

                  if not image_url:
                      continue

                  if image_url in seen_images:
                      print(
                          "Skipping duplicate image:",
                          image_url
                      )
                      continue

                  seen_images.add(
                      image_url
                  )

                  pin_title = (
                      build_pinterest_title(
                          product,
                          description,
                          image_url,
                          image_index
                      )
                  )

                  pin_description = (
                      build_pinterest_description(
                          product,
                          description,
                          image_url,
                          image_index
                      )
                  )

                  # Stable, compact GUID based on product ID + exact image URL.
                  image_key = (
                      product_id
                      + "|"
                      + image_url
                  )

                  image_hash = (
                      hashlib.sha256(
                          image_key.encode(
                              "utf-8"
                          )
                      ).hexdigest()
                  )

                  guid = (
                      "rawayat-pinterest-"
                      + image_hash
                  )

                  length, mime_type = (
                      get_image_metadata(
                          image_url
                      )
                  )

                  enclosure_length = (
                      length
                      if length
                      else "0"
                  )

                  rss_item = f"""
            <item>
              <title>{escape(pin_title)}</title>
              <link>{escape(product_url)}</link>
              <guid isPermaLink="false">{escape(guid)}</guid>
              <description>{escape(pin_description)}</description>
              <pubDate>{escape(published_rss_date)}</pubDate>
              <enclosure url="{escape(image_url)}" length="{escape(enclosure_length)}" type="{escape(mime_type)}" />
              <media:content url="{escape(image_url)}" type="{escape(mime_type)}" medium="image" />
            </item>
            """

                  rss_items.append(
                      rss_item
                  )

              if not variants:
                  continue

              first_variant = variants[0]

              price_raw = (
                  first_variant.get(
                      "price",
                      "0"
                  )
                  or "0"
              )

              try:
                  price_number = float(
                      price_raw
                  )
              except (
                  ValueError,
                  TypeError
              ):
                  price_number = 0

              if price_number <= 0:
                  print(
                      "Skipping catalog item with invalid price:",
                      title
                  )
                  continue

              pinterest_price = (
                  f"{price_number:.2f} "
                  f"{CURRENCY}"
              )

              main_image = (
                  images[0].get(
                      "src",
                      ""
                  )
              )

              if not main_image:
                  continue

              if is_preorder(product):
                  availability = "preorder"
              else:
                  is_available = any(
                      variant.get(
                          "available",
                          False
                      )
                      for variant in variants
                  )

                  availability = (
                      "in stock"
                      if is_available
                      else "out of stock"
                  )

              vendor = clean_text(
                  product.get(
                      "vendor",
                      BRAND
                  )
              )

              if not vendor:
                  vendor = BRAND

              category = determine_category(
                  product
              )

              catalog_title = (
                  title
                  or "Pakistani Fashion"
              )

              catalog_description = (
                  build_catalog_description(
                      product,
                      description
                  )
              )

              colors, fabrics = (
                  extract_attributes(
                      product,
                      description
                  )
              )

              color_value = (
                  colors[0]
                  if colors
                  else ""
              )

              material_value = (
                  fabrics[0]
                  if fabrics
                  else ""
              )

              category_path = (
                  google_product_category(
                      product
                  )
              )

              cat_item_parts = [
                  "<item>",
                 f"  <g:id>{escape(product_id)}</g:id>",
                  f"  <g:item_group_id>{escape(product_id)}</g:item_group_id>",
                  f"  <g:title>{escape(catalog_title[:CATALOG_TITLE_MAX])}</g:title>",
                  f"  <g:description>{escape(catalog_description)}</g:description>",
                  f"  <g:link>{escape(product_url)}</g:link>",
                  f"  <g:image_link>{escape(main_image)}</g:image_link>",
                  f"  <g:price>{escape(pinterest_price)}</g:price>",
                  f"  <g:availability>{availability}</g:availability>",
                  "  <g:condition>new</g:condition>",
                  f"  <g:brand>{escape(vendor)}</g:brand>",
                  "  <g:gender>female</g:gender>",
                  "  <g:age_group>adult</g:age_group>",
                  f"  <g:product_type>{escape(product_type_label(category))}</g:product_type>",
                  f"  <g:google_product_category>{escape(category_path)}</g:google_product_category>"
              ]

              if color_value:
                  cat_item_parts.append(
                      f"  <g:color>{escape(color_value[:30])}</g:color>"
                  )

              if material_value:
                  cat_item_parts.append(
                      f"  <g:material>{escape(material_value[:30])}</g:material>"
                  )

              cat_item_parts.append(
                  "</item>"
              )

              catalog_items.append(
                  "\n".join(
                      cat_item_parts
                  )
              )

          rss = f"""<?xml version="1.0" encoding="UTF-8"?>
          <rss version="2.0"
               xmlns:media="http://search.yahoo.com/mrss/">
            <channel>
              <title>{escape(STORE_NAME)}</title>
              <link>{escape(SHOPIFY_STORE)}</link>
              <description>{escape(STORE_NAME)} Pakistani Luxury Fashion</description>
              <language>en-us</language>
              <lastBuildDate>{escape(format_datetime(datetime.now(timezone.utc), usegmt=True))}</lastBuildDate>
              {''.join(rss_items)}
            </channel>
          </rss>
          """

          with open(
              "rss.xml",
              "w",
              encoding="utf-8"
          ) as file:
              file.write(rss)

          catalog = f"""<?xml version="1.0" encoding="UTF-8"?>
          <rss version="2.0"
               xmlns:g="http://base.google.com/ns/1.0">
            <channel>
              <title>{escape(STORE_NAME)} Catalog</title>
              <link>{escape(SHOPIFY_STORE)}</link>
              <description>{escape(STORE_NAME)} Pinterest Product Catalog</description>
              {''.join(catalog_items)}
            </channel>
          </rss>
          """

          with open(
              "catalog.xml",
              "w",
              encoding="utf-8"
          ) as file:
              file.write(catalog)

          # Validate both XML outputs before committing.
          ET.parse("rss.xml")
          ET.parse("catalog.xml")

          print(
              f"Generated rss.xml with "
              f"{len(rss_items)} image items."
          )

          print(
              f"Generated catalog.xml with "
              f"{len(catalog_items)} products."
          )

          print(
              "Prices kept in PKR. "
              "No currency conversion performed."
          )

          print(
              "Pinterest Pin titles are product-specific, "
              "image-specific, and limited to 100 characters."
          )

          print(
              "Pinterest Pin descriptions are product-specific, "
              "image-specific, and kept below 800 characters."
          )

          print(
              "RSS items use stable hash-based GUIDs."
          )

          print(
              "RSS enclosure MIME types are detected from "
              "the image URL/CDN headers."
          )

          print(
              "RSS includes media:content for image compatibility."
          )

          print(
              "Catalog titles match Shopify product titles."
          )

          print(
              "Catalog includes product type, gender, age group, "
              "colour/material when available, and Google category."
          )

          print(
              "Existing Shopify SKUs preserved where available."
          )

          print(
              "Temporary descriptive SKUs generated for products "
              "without Shopify SKUs."
          )

          print(
              "Shopify API SKU synchronization is NOT enabled yet."
          )

          PY

      - name: Commit RSS feed and Catalog
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add rss.xml catalog.xml

          git diff --cached --quiet || git commit -m "Optimize Rawayat Pinterest RSS and catalog feeds"

          git push
