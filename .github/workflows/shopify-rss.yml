name: Update Shopify RSS Feed

on:
  schedule:
    # Run every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Run RSS Feed Generator
        run: python3 rawayat-rss-generator.py
        env:
          PYTHONUNBUFFERED: 1

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check if changes exist in the generated files
          if [ -n "$(git status --porcelain rss.xml catalog.xml)" ]; then
            git add rss.xml catalog.xml
            git commit -m "chore: Update RSS and catalog feeds [skip ci]"
            git push
          else
            echo "No changes detected."
          fi
          
