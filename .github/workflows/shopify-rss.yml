def setup_logging() -> logging.Logger:
    logger = logging.getLogger("RawayatRSS")
    logger.setLevel(logging.INFO)

    handler = logging.StreamHandler(sys.stdout)
    handler.setLevel(logging.INFO)

    formatter = logging.Formatter(
        "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    )
    handler.setFormatter(formatter)
    logger.addHandler(handler)

    return logger


logger = setup_logging()


def fetch_json_with_retry(
    url: str,
    max_retries: int = Config.MAX_RETRIES,
    timeout: int = Config.SHOPIFY_TIMEOUT
) -> Dict:
    last_error = None

    for attempt in range(max_retries):
        try:
            request = urllib.request.Request(
                url,
                headers={"User-Agent": Config.USER_AGENT}
            )

            with urllib.request.urlopen(request, timeout=timeout) as response:
                return json.load(response)

        except urllib.error.HTTPError as e:
            last_error = f"HTTP {e.code}: {e.reason}"

            if e.code in (400, 403, 404):
                logger.error(f"Non-retryable HTTP error: {last_error}")
                raise

        except (urllib.error.URLError, TimeoutError) as e:
            last_error = str(e)

        except json.JSONDecodeError as e:
            last_error = f"Invalid JSON response: {e}"

        except Exception as e:
            last_error = f"Unexpected error: {e}"

        if attempt < max_retries - 1:
            delay = Config.RETRY_BACKOFF ** attempt

            logger.warning(
                f"Fetch failed (attempt {attempt + 1}/{max_retries}): "
                f"{last_error}. Retrying in {delay}s..."
            )

            time.sleep(delay)

    raise Exception(f"Failed after {max_retries} attempts: {last_error}")


def fetch_shopify_products(store_url: str) -> List[Dict]:
    products = []
    page = 1
    max_pages = 1000

    while page <= max_pages:
        try:
            query = {
                "limit": str(Config.PRODUCTS_PER_PAGE),
                "page": str(page)
            }

            query_string = urllib.parse.urlencode(query)
            url = f"{store_url}/products.json?{query_string}"

            logger.info(f"Fetching page {page}...")
            response = fetch_json_with_retry(url)

            page_products = response.get("products", [])

            if not page_products:
                logger.info(f"No more products at page {page}")
                break

            products.extend(page_products)

            logger.info(
                f"Retrieved {len(page_products)} products from page {page}"
            )

            if len(page_products) < Config.PRODUCTS_PER_PAGE:
                logger.info(
                    "Reached last page (fewer than page size products)"
                )
                break

            page += 1
            time.sleep(Config.RATE_LIMIT_DELAY)

        except Exception as e:
            logger.error(f"Error fetching page {page}: {e}")

            if page == 1:
                raise

            logger.warning(
                "Continuing with products already fetched"
            )
            break

    logger.info(f"Total products fetched: {len(products)}")
    return products


def clean_text(value: any) -> str:
    if not value:
        return ""

    if isinstance(value, list):
        value = " ".join(str(item) for item in value)

    value = str(value)
    value = html.unescape(value)

    value = re.sub(
        r"<(script|style).*?>.*?</\1>",
        " ",
        value,
        flags=re.I | re.S
    )

    value = re.sub(r"<[^>]+>", " ", value)
    value = " ".join(value.split())

    return value.strip()


def normalize_tags(value: any) -> str:
    if isinstance(value, list):
        return " ".join(str(item) for item in value)

    return str(value or "")


def trim_text(text: str, max_chars: int) -> str:
    text = clean_text(text)

    if len(text) <= max_chars:
        return text

    cut = text[:max_chars]

    boundary_candidates = [
        cut.rfind(". "),
        cut.rfind("! "),
        cut.rfind("? ")
    ]

    boundary = max(boundary_candidates)

    if boundary >= int(max_chars * 0.60):
        return cut[:boundary + 1]

    return cut.rstrip(" ,;:-") + "."


