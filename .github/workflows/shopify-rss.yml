name: Update Shopify RSS Feed

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate RSS feed
        run: |
          python3 <<'PY'
          import json
          import urllib.request
          import html
          from datetime import datetime, timezone
          from xml.sax.saxutils import escape

          SHOPIFY_STORE = "https://rawayatluxe.com"

          url = SHOPIFY_STORE + "/products.json?limit=250"

          req = urllib.request.Request(
              url,
              headers={"User-Agent": "Rawayat-Pinterest-RSS/1.0"}
          )

          with urllib.request.urlopen(req) as response:
              data = json.load(response)

          products = data.get("products", [])
          rss_items = []

          for product in products:
              title = product.get("title", "")
              handle = product.get("handle", "")
              product_url = SHOPIFY_STORE + "/products/" + handle

              description = product.get("body_html", "")
              description = html.unescape(description)
              description = " ".join(description.split())

              images = product.get("images", [])

              if not images:
                  continue

              published = product.get("published_at") or datetime.now(timezone.utc).isoformat()

              for image in images:
                  image_url = image.get("src", "")

                  if not image_url:
                      continue

                  item = f"""
          <item>
            <title>{escape(title)}</title>
            <link>{escape(product_url)}</link>
            <guid>{escape(product_url + "?image=" + image_url)}</guid>
            <description>{escape(description)}</description>
            <pubDate>{escape(published)}</pubDate>
            <enclosure url="{escape(image_url)}" type="image/jpeg" />
          </item>
          """

                  rss_items.append(item)

          rss = f"""<?xml version="1.0" encoding="UTF-8"?>
          <rss version="2.0">
            <channel>
              <title>Rawayat Luxe</title>
              <link>{SHOPIFY_STORE}</link>
              <description>Rawayat Luxe Pakistani Luxury Fashion</description>
              <language>en-us</language>
              {''.join(rss_items)}
            </channel>
          </rss>
          """

          with open("rss.xml", "w", encoding="utf-8") as f:
              f.write(rss)

          print(f"Generated RSS feed with {len(rss_items)} images.")
          PY

      - name: Commit RSS feed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add rss.xml

          git diff --cached --quiet || git commit -m "Update Shopify RSS feed with all product images"

          git push
