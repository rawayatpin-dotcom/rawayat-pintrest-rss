name: Update Shopify RSS Feed

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate RSS and Catalog feeds
        run: |
          python3 <<'PY'
          import json
          import urllib.request
          import html
          from datetime import datetime, timezone
          from xml.sax.saxutils import escape

          # ==================================================
          # SHOPIFY STORE
          # ==================================================

          SHOPIFY_STORE = "https://rawayatluxe.com"

          # ==================================================
          # GET CURRENT PKR TO USD EXCHANGE RATE
          # ==================================================

          exchange_url = "https://open.er-api.com/v6/latest/PKR"

          exchange_request = urllib.request.Request(
              exchange_url,
              headers={
                  "User-Agent": "Rawayat-Pinterest-Catalog/1.0"
              }
          )

          with urllib.request.urlopen(
              exchange_request,
              timeout=30
          ) as response:
              exchange_data = json.load(response)

          if exchange_data.get("result") != "success":
              raise RuntimeError(
                  "Unable to retrieve PKR to USD exchange rate."
              )

          pkr_to_usd = exchange_data["rates"]["USD"]

          print(
              f"Current PKR to USD exchange rate: {pkr_to_usd}"
          )

          # ==================================================
          # GET PRODUCTS FROM SHOPIFY
          # ==================================================

          url = SHOPIFY_STORE + "/products.json?limit=250"

          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Rawayat-Pinterest-RSS/1.0"
              }
          )

          with urllib.request.urlopen(
              req,
              timeout=30
          ) as response:
              data = json.load(response)

          products = data.get("products", [])

          rss_items = []
          catalog_items = []

          # ==================================================
          # PROCESS PRODUCTS
          # ==================================================

          for product in products:

              title = product.get("title", "")
              handle = product.get("handle", "")

              product_url = (
                  SHOPIFY_STORE
                  + "/products/"
                  + handle
              )

              # ------------------------------------------------
              # PRODUCT DESCRIPTION
              # ------------------------------------------------

              description = product.get(
                  "body_html",
                  ""
              )

              description = html.unescape(
                  description
              )

              description = " ".join(
                  description.split()
              )

              # ------------------------------------------------
              # PRODUCT IMAGES AND VARIANTS
              # ------------------------------------------------

              images = product.get(
                  "images",
                  []
              )

              variants = product.get(
                  "variants",
                  []
              )

              if not images:
                  continue

              published = (
                  product.get("published_at")
                  or datetime.now(
                      timezone.utc
                  ).isoformat()
              )

              # ==================================================
              # BUILD RSS.XML
              #
              # ONE PIN PER PRODUCT IMAGE
              # ==================================================

              for image in images:

                  image_url = image.get(
                      "src",
                      ""
                  )

                  if not image_url:
                      continue

                  item = f"""
            <item>
              <title>{escape(title)}</title>
              <link>{escape(product_url)}</link>
              <guid>{escape(product_url + "?image=" + image_url)}</guid>
              <description>{escape(description)}</description>
              <pubDate>{escape(published)}</pubDate>
              <enclosure url="{escape(image_url)}" type="image/jpeg" />
            </item>
            """

                  rss_items.append(item)

              # ==================================================
              # BUILD CATALOG.XML
              #
              # SHOPIFY PRICE = PKR
              # PINTEREST PRICE = USD
              # ==================================================

              if variants:

                  first_variant = variants[0]

                  # ------------------------------------------------
                  # PRODUCT ID
                  # ------------------------------------------------

                  prod_id = str(
                      product.get(
                          "id",
                          ""
                      )
                  )

                  # ------------------------------------------------
                  # GET SHOPIFY PRICE IN PKR
                  # ------------------------------------------------

                  price_pkr = float(
                      first_variant.get(
                          "price",
                          "0"
                      )
                  )

                  # ------------------------------------------------
                  # CONVERT PKR TO USD
                  # ------------------------------------------------

                  price_usd = (
                      price_pkr
                      * pkr_to_usd
                  )

                  # ------------------------------------------------
                  # FORMAT PRICE FOR PINTEREST
                  # ------------------------------------------------

                  pinterest_price = (
                      f"{price_usd:.2f} USD"
                  )

                  # ------------------------------------------------
                  # MAIN PRODUCT IMAGE
                  # ------------------------------------------------

                  main_image = images[0].get(
                      "src",
                      ""
                  )

                  # ------------------------------------------------
                  # PRODUCT AVAILABILITY
                  # ------------------------------------------------

                  is_available = any(
                      v.get(
                          "available",
                          False
                      )
                      for v in variants
                  )

                  availability = (
                      "in stock"
                      if is_available
                      else "out of stock"
                  )

                  # ------------------------------------------------
                  # BRAND
                  # ------------------------------------------------

                  vendor = product.get(
                      "vendor",
                      "Rawayat"
                  )

                  # ==================================================
                  # CATALOG ITEM
                  # ==================================================

                  cat_item = f"""
            <item>
              <g:id>{escape(prod_id)}</g:id>
              <g:title>{escape(title)}</g:title>
              <g:description>{escape(description)}</g:description>
              <g:link>{escape(product_url)}</g:link>
              <g:image_link>{escape(main_image)}</g:image_link>
              <g:price>{escape(pinterest_price)}</g:price>
              <g:availability>{availability}</g:availability>
              <g:condition>new</g:condition>
              <g:brand>{escape(vendor)}</g:brand>
              <g:google_product_category>Clothing &amp; Accessories &gt; Clothing &gt; Dresses</g:google_product_category>
            </item>
            """

                  catalog_items.append(
                      cat_item
                  )

          # ==================================================
          # WRITE RSS.XML
          # ==================================================

          rss = f"""<?xml version="1.0" encoding="UTF-8"?>
          <rss version="2.0">
            <channel>
              <title>Rawayat Luxe</title>
              <link>{SHOPIFY_STORE}</link>
              <description>Rawayat Luxe Pakistani Luxury Fashion</description>
              <language>en-us</language>
              {''.join(rss_items)}
            </channel>
          </rss>
          """

          with open(
              "rss.xml",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(rss)

          # ==================================================
          # WRITE CATALOG.XML
          # ==================================================

          catalog = f"""<?xml version="1.0" encoding="UTF-8"?>
          <rss version="2.0" xmlns:g="http://base.google.com/ns/1.0">
            <channel>
              <title>Rawayat Luxe Catalog</title>
              <link>{SHOPIFY_STORE}</link>
              <description>Rawayat Luxe Pinterest Product Catalog</description>
              {''.join(catalog_items)}
            </channel>
          </rss>
          """

          with open(
              "catalog.xml",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(catalog)

          # ==================================================
          # FINAL REPORT
          # ==================================================

          print(
              f"Generated rss.xml with {len(rss_items)} images."
          )

          print(
              f"Generated catalog.xml with {len(catalog_items)} products."
          )

          print(
              "Catalog prices converted from PKR to USD."
          )

          print(
              "Google product category added to catalog."
          )

          PY

      - name: Commit RSS feed and Catalog
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add rss.xml catalog.xml

          git diff --cached --quiet || git commit -m "Update Shopify RSS feed and Pinterest Catalog XML"

          git push
