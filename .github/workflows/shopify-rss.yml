def determine_category(product: Dict) -> str:
    title = clean_text(product.get("title", "")).lower()
    product_type = clean_text(product.get("product_type", "")).lower()
    tags = normalize_tags(product.get("tags", "")).lower()

    combined = " ".join([title, product_type, tags])

    for keywords, code in CATEGORY_RULES:
        for keyword in keywords:
            if keyword in combined:
                return code

    if any(term in combined for term in PREMIUM_TERMS):
        return "FOR"

    return "FAS"


def extract_colors(description: str) -> List[str]:
    colors = []

    matches = re.findall(
        r"\bColor:\s*"
        r"([A-Za-z][A-Za-z\s/&-]{1,30}?)"
        r"(?=\s+Fabric:|Fabric:"
        r"|\s+Work Details:|Work Details:"
        r"|\s+Model\b|Model\b"
        r"|\s+Note:|Note:"
        r"|$)",
        description,
        flags=re.I
    )

    for value in matches:
        color = clean_text(value)

        if color and color.lower() not in [
            item.lower() for item in colors
        ]:
            colors.append(color)

    return colors[:3]


def extract_fabrics(
    product: Dict,
    description: str
) -> List[str]:
    combined = " ".join([
        clean_text(product.get("title", "")),
        description
    ]).lower()

    fabrics = []

    for fabric in FABRIC_TERMS:
        if fabric in combined:
            if fabric not in [item.lower() for item in fabrics]:
                fabrics.append(fabric.title())

    return fabrics[:3]


def extract_attributes(
    product: Dict,
    description: str
) -> Tuple[List[str], List[str]]:
    colors = extract_colors(description)
    fabrics = extract_fabrics(product, description)

    return colors, fabrics


def is_preorder(product: Dict) -> bool:
    tags = normalize_tags(product.get("tags", "")).lower()
    title = clean_text(product.get("title", "")).lower()

    combined = tags + " " + title

    preorder_terms = [
        "pre-order",
        "preorder",
        "pre order"
    ]

    return any(term in combined for term in preorder_terms)


class ImageMetadataCache:

    def __init__(self):
        self.cache: Dict[str, Tuple[str, str]] = {}

    def get(self, url: str) -> Optional[Tuple[str, str]]:
        return self.cache.get(url)

    def set(
        self,
        url: str,
        size: str,
        mime_type: str
    ):
        self.cache[url] = (size, mime_type)

    def clear(self):
        self.cache.clear()


def get_image_metadata(
    image_url: str,
    cache: ImageMetadataCache
) -> Tuple[str, str]:

    cached = cache.get(image_url)

    if cached:
        return cached

    parsed = urllib.parse.urlparse(image_url)

    mime_type = (
        mimetypes.guess_type(parsed.path)[0]
        or "image/jpeg"
    )

    content_length = ""

    try:
        request = urllib.request.Request(
            image_url,
            method="HEAD",
            headers={"User-Agent": Config.USER_AGENT}
        )

        with urllib.request.urlopen(
            request,
            timeout=Config.IMAGE_TIMEOUT
        ) as response:

            raw_length = response.headers.get("Content-Length")

            if raw_length:
                try:
                    size_mb = int(raw_length) / (1024 * 1024)

                    if size_mb > Config.MAX_IMAGE_SIZE_MB:
                        logger.warning(
                            f"Image {image_url} is {size_mb:.2f}MB "
                            f"(exceeds {Config.MAX_IMAGE_SIZE_MB}MB limit)"
                        )

                    content_length = str(int(raw_length))

                except ValueError:
                    pass

            header_type = response.headers.get("Content-Type")

            if header_type:
                header_type = header_type.split(
                    ";",
                    1
                )[0].strip()

                if header_type.startswith("image/"):
                    mime_type = header_type

    except Exception as e:
        logger.warning(
            f"Failed to fetch image metadata for {image_url}: {e}"
        )

    metadata = (content_length, mime_type)
    cache.set(image_url, *metadata)

    return metadata


def image_view_label(
    image_url: str,
    image_index: int
) -> str:

    path = urllib.parse.urlparse(image_url).path
    filename = path.rsplit("/", 1)[-1]

    stem = re.sub(
        r"\.[A-Za-z0-9]+$",
        "",
        filename
    )

    match = re.search(
        r"(?:[-_ ])([A-Za-z])(?:_\d+)?$",
        stem
    )

    if match:
        return "View " + match.group(1).upper()

    return f"View {image_index}"


def get_existing_sku(variants: List[Dict]) -> str:
    for variant in variants:
        sku = variant.get("sku") or ""

        if isinstance(sku, list):
            sku = " ".join(str(item) for item in sku)

        sku = str(sku).strip()

        if sku:
            return sku

    return ""


def generate_temporary_sku(
    product: Dict,
    used_skus: Set[str]
) -> str:

    product_id = str(product.get("id", ""))
    category = determine_category(product)

    if not product_id:
        product_id = "0000"

    number = product_id[-4:].zfill(4)
    base = f"RAW-{category}-{number}"

    sku = base
    counter = 2

    while sku in used_skus:
        sku = f"{base}-{counter}"
        counter += 1

    used_skus.add(sku)

    return sku


def build_pinterest_title(
    product: Dict,
    description: str,
    image_url: str,
    image_index: int
) -> str:

    original_title = (
        clean_text(product.get("title", ""))
        or "Pakistani Fashion"
    )

    category = determine_category(product)

    colors, _ = extract_attributes(
        product,
        description
    )

    color = colors[0] if colors else ""

    view = image_view_label(
        image_url,
        image_index
    )

    category_term = CATEGORY_DISPLAY_NAMES.get(
        category,
        "Pakistani Fashion"
    )

    vendor = clean_text(
        product.get("vendor", Config.BRAND)
    )

    parts = [original_title]

    if color:
        parts.append(color)

    parts.append(category_term)
    parts.append(view)

    if vendor and vendor.lower() != Config.BRAND.lower():
        parts.append(vendor)

    candidates = [
        " | ".join(parts),
        " | ".join([
            original_title,
            color,
            category_term,
            view
        ]),
        " | ".join([
            original_title,
            color,
            view
        ]),
        " | ".join([
            original_title,
            view
        ])
    ]

    for candidate in candidates:
        candidate = " | ".join([
            item
            for item in candidate.split(" | ")
            if item
        ])

        if len(candidate) <= Config.PIN_TITLE_MAX:
            return candidate

    return (
        original_title[
            :(Config.PIN_TITLE_MAX - len(view) - 3)
        ].rstrip()
        + " | "
        + view
    )


def build_pinterest_description(
    product: Dict,
    original_description: str,
    image_url: str,
    image_index: int
) -> str:

    title = (
        clean_text(product.get("title", ""))
        or "Pakistani Fashion"
    )

    category = determine_category(product)

    colors, fabrics = extract_attributes(
        product,
        original_description
    )

    view = image_view_label(
        image_url,
        image_index
    )

    parts = [
        f"{view} of {title}."
    ]

    if colors:
        parts.append(
            "Colour: "
            + ", ".join(colors[:2])
            + "."
        )

    if fabrics:
        parts.append(
            "Fabric: "
            + ", ".join(fabrics[:2])
            + "."
        )

    fashion_term = FASHION_TERMS.get(
        category,
        "Pakistani women's fashion"
    )

    parts.append(
        f"A {fashion_term} look from {Config.STORE_NAME}, "
        f"featuring detailed Pakistani craftsmanship."
    )

    if original_description:
        parts.append(
            trim_text(
                original_description,
                560
            )
        )

    parts.append(
        "Shop Rawayat Luxe online for Pakistani fashion with "
        "worldwide availability."
    )

    description = " ".join(parts)

    return trim_text(
        description,
        Config.PIN_DESCRIPTION_MAX
    )


def build_catalog_description(
    product: Dict,
    original_description: str
) -> str:

    title = (
        clean_text(product.get("title", ""))
        or "Pakistani Fashion"
    )

    category = determine_category(product)

    colors, fabrics = extract_attributes(
        product,
        original_description
    )

    parts = [title + "."]

    if colors:
        parts.append(
            "Colour: "
            + ", ".join(colors)
            + "."
        )

    if fabrics:
        parts.append(
            "Fabric: "
            + ", ".join(fabrics)
            + "."
        )

    fashion_term = FASHION_TERMS.get(
        category,
        "Pakistani women's fashion"
    )

    fashion_term = re.sub(
        r"^Pakistani women's\s+",
        "",
        fashion_term,
        flags=re.I
    )

    parts.append(
        f"Pakistani women's {fashion_term} "
        f"from {Config.STORE_NAME}."
    )

    if original_description:
        parts.append(original_description)

    parts.append("Worldwide availability.")

    return trim_text(
        " ".join(parts),
        Config.CATALOG_DESCRIPTION_MAX
    )


def format_rss_date(value: any) -> str:
    if not value:
        return format_datetime(
            datetime.now(timezone.utc),
            usegmt=True
        )

    try:
        parsed = datetime.fromisoformat(
            str(value).replace("Z", "+00:00")
        )

        if parsed.tzinfo is None:
            parsed = parsed.replace(
                tzinfo=timezone.utc
            )

        return format_datetime(
            parsed,
            usegmt=False
        )

    except Exception as e:
        logger.warning(
            f"Failed to parse date {value}: {e}"
        )

        return format_datetime(
            datetime.now(timezone.utc),
            usegmt=True
        )


def generate_rss_feed(
    products: List[Dict],
    image_cache: ImageMetadataCache
) -> Tuple[str, int]:

    rss_items = []
    current_time = datetime.now(timezone.utc)

    for product in products:

        title = clean_text(
            product.get("title", "")
        )

        handle = product.get("handle", "") or ""

        if not handle:
            logger.debug(
                f"Skipping product without handle: {title}"
            )
            continue

        product_id = str(
            product.get("id", "")
        )

        product_url = (
            f"{Config.SHOPIFY_STORE}/products/{handle}"
        )

        raw_description = product.get(
            "body_html",
            ""
        )

        description = clean_text(
            raw_description
        )

        images = product.get(
            "images",
            []
        )

        if not images:
            logger.debug(
                f"Skipping product without images: {title}"
            )
            continue

        published = (
            product.get("published_at")
            or current_time.isoformat()
        )

        published_rss_date = format_rss_date(
            published
        )

        first_image = images[0]
        image_url = first_image.get(
            "src",
            ""
        )

        if not image_url:
            logger.debug(
                "Skipping RSS item, first image has no URL: "
                f"{title}"
            )
            continue

        image_index = 1

        pin_title = build_pinterest_title(
            product,
            description,
            image_url,
            image_index
        )

        pin_description = build_pinterest_description(
            product,
            description,
            image_url,
            image_index
        )

        image_key = f"{product_id}|{image_url}"

        image_hash = hashlib.sha256(
            image_key.encode("utf-8")
        ).hexdigest()

        guid = f"rawayat-pinterest-{image_hash}"

        content_length, mime_type = get_image_metadata(
            image_url,
            image_cache
        )

        enclosure_length = (
            content_length
            if content_length
            else "0"
        )

        rss_item = f"""
            <item>
              <title>{escape(pin_title)}</title>
              <link>{escape(product_url)}</link>
              <guid isPermaLink="false">{escape(guid)}</guid>
              <description>{escape(pin_description)}</description>
              <pubDate>{escape(published_rss_date)}</pubDate>
              <enclosure url="{escape(image_url)}" length="{escape(enclosure_length)}" type="{escape(mime_type)}" />
              <media:content url="{escape(image_url)}" type="{escape(mime_type)}" medium="image" />
            </item>
            """

        rss_items.append(rss_item)

    build_date = format_datetime(
        current_time,
        usegmt=True
    )

    rss = f"""<?xml version="1.0" encoding="UTF-8"?>
<rss version="2.0"
     xmlns:media="http://search.yahoo.com/mrss/">
  <channel>
    <title>{escape(Config.STORE_NAME)}</title>
    <link>{escape(Config.SHOPIFY_STORE)}</link>
    <description>{escape(Config.STORE_NAME)} Pakistani Luxury Fashion</description>
    <language>en-us</language>
    <lastBuildDate>{escape(build_date)}</lastBuildDate>
    <generator>Rawayat Luxe Feed Generator v2.0</generator>
    <webMaster>{escape(Config.CONTACT_EMAIL)}</webMaster>
    <docs>https://www.rssboard.org/rss-specification</docs>
    <ttl>360</ttl>
    {''.join(rss_items)}
  </channel>
</rss>
"""

    return rss, len(rss_items)


def generate_catalog_feed(
    products: List[Dict],
    image_cache: ImageMetadataCache
) -> Tuple[str, int]:

    catalog_items = []

    for product in products:

        title = clean_text(
            product.get("title", "")
        )

        handle = product.get(
            "handle",
            ""
        ) or ""

        if not handle:
            continue

        product_id = str(
            product.get("id", "")
        )

        product_url = (
            f"{Config.SHOPIFY_STORE}/products/{handle}"
        )

        raw_description = product.get(
            "body_html",
            ""
        )

        description = clean_text(
            raw_description
        )

        images = product.get(
            "images",
            []
        )

        variants = product.get(
            "variants",
            []
        )

        if not images or not variants:
            continue

        first_variant = variants[0]

        price_raw = (
            first_variant.get("price")
            or "0"
        )

        try:
            price_number = float(price_raw)

        except (ValueError, TypeError):
            logger.debug(
                f"Invalid price for {title}: {price_raw}"
            )
            continue

        if price_number <= 0:
            logger.debug(
                "Skipping catalog item with zero/negative price: "
                f"{title}"
            )
            continue

        pinterest_price = (
            f"{price_number:.2f} {Config.CURRENCY}"
        )

        main_image = images[0].get(
            "src",
            ""
        )

        if not main_image:
            continue

        if is_preorder(product):
            availability = "preorder"

        else:
            is_available = any(
                v.get("available", False)
                for v in variants
            )

            availability = (
                "in stock"
                if is_available
                else "out of stock"
            )

        vendor = clean_text(
            product.get(
                "vendor",
                Config.BRAND
            )
        ) or Config.BRAND

        category = determine_category(
            product
        )

        catalog_title = (
            title
            or "Pakistani Fashion"
        )

        catalog_description = build_catalog_description(
            product,
            description
        )

        colors, fabrics = extract_attributes(
            product,
            description
        )

        color_value = (
            colors[0]
            if colors
            else ""
        )

        material_value = (
            fabrics[0]
            if fabrics
            else ""
        )

        category_path = GOOGLE_CATEGORIES.get(
            category,
            "Apparel & Accessories > Clothing > Traditional & Ceremonial Clothing"
        )

        cat_item_parts = [
            "<item>",
            f"  <g:id>{escape(product_id)}</g:id>",
            f"  <g:item_group_id>{escape(product_id)}</g:item_group_id>",
            f"  <g:title>{escape(catalog_title[:Config.CATALOG_TITLE_MAX])}</g:title>",
            f"  <g:description>{escape(catalog_description)}</g:description>",
            f"  <g:link>{escape(product_url)}</g:link>",
            f"  <g:image_link>{escape(main_image)}</g:image_link>",
            f"  <g:price>{escape(pinterest_price)}</g:price>",
            f"  <g:availability>{availability}</g:availability>",
            "  <g:condition>new</g:condition>",
            f"  <g:brand>{escape(vendor)}</g:brand>",
            "  <g:gender>female</g:gender>",
            "  <g:age_group>adult</g:age_group>",
            f"  <g:product_type>{escape(PRODUCT_TYPE_LABELS.get(category, 'Pakistani Fashion'))}</g:product_type>",
            f"  <g:google_product_category>{escape(category_path)}</g:google_product_category>"
        ]

        if color_value:
            cat_item_parts.append(
                f"  <g:color>{escape(color_value[:30])}</g:color>"
            )

        if material_value:
            cat_item_parts.append(
                f"  <g:material>{escape(material_value[:30])}</g:material>"
            )

        cat_item_parts.append("</item>")

        catalog_items.append(
            "\n".join(cat_item_parts)
        )

    catalog = f"""<?xml version="1.0" encoding="UTF-8"?>
<rss version="2.0"
     xmlns:g="http://base.google.com/ns/1.0">
  <channel>
    <title>{escape(Config.STORE_NAME)} Catalog</title>
    <link>{escape(Config.SHOPIFY_STORE)}</link>
    <description>{escape(Config.STORE_NAME)} Pinterest Product Catalog</description>
    <generator>Rawayat Luxe Feed Generator v2.0</generator>
    {''.join(catalog_items)}
  </channel>
</rss>
"""

    return catalog, len(catalog_items)


def validate_xml(
    xml_string: str,
    schema_type: str = "rss"
) -> Tuple[bool, str]:

    try:
        root = ET.fromstring(
            xml_string
        )

        if schema_type == "rss":

            if root.tag != "rss":
                return False, "Root element must be <rss>"

            if "version" not in root.attrib:
                return False, (
                    "Missing version attribute on <rss>"
                )

            channel = root.find(
                "channel"
            )

            if channel is None:
                return False, (
                    "Missing <channel> element"
                )

            required_channel_fields = [
                "title",
                "link",
                "description"
            ]

            for field in required_channel_fields:
                if channel.find(field) is None:
                    return False, (
                        f"Missing required <{field}> in channel"
                    )

        return True, "Valid XML"

    except ET.ParseError as e:
        return False, f"XML parse error: {e}"

    except Exception as e:
        return False, f"Validation error: {e}"


def write_feed_file(
    filepath: str,
    content: str
) -> bool:

    try:
        Path(filepath).parent.mkdir(
            parents=True,
            exist_ok=True
        )

        with open(
            filepath,
            "w",
            encoding="utf-8"
        ) as f:
            f.write(content)

        logger.info(
            f"Successfully wrote {filepath} "
            f"({len(content)} bytes)"
        )

        return True

    except Exception as e:
        logger.error(
            f"Failed to write {filepath}: {e}"
        )

        return False


def main():

    try:
        logger.info("=" * 70)
        logger.info(
            "Rawayat Luxe Pinterest RSS & Catalog Feed Generator v2.0"
        )
        logger.info("=" * 70)

        logger.info(
            f"Store: {Config.SHOPIFY_STORE}"
        )

        logger.info(
            f"Brand: {Config.BRAND}"
        )

        logger.info(
            f"Currency: {Config.CURRENCY}"
        )

        logger.info("")

        logger.info(
            "STEP 1: Fetching products from Shopify..."
        )

        products = fetch_shopify_products(
            Config.SHOPIFY_STORE
        )

        if not products:
            logger.error(
                "No products fetched. Aborting."
            )
            return 1

        logger.info(
            f"Successfully fetched {len(products)} products"
        )

        logger.info("")

        image_cache = ImageMetadataCache()

        logger.info(
            "STEP 2: Generating RSS feed..."
        )

        rss_content, rss_count = generate_rss_feed(
            products,
            image_cache
        )

        is_valid, message = validate_xml(
            rss_content,
            "rss"
        )

        if not is_valid:
            logger.error(
                f"RSS validation failed: {message}"
            )
            return 1

        logger.info(
            f"RSS feed generated with {rss_count} items"
        )

        logger.info(
            "RSS feed validation: PASSED ✓"
        )

        logger.info("")

        logger.info(
            "STEP 3: Generating catalog feed..."
        )

        catalog_content, catalog_count = generate_catalog_feed(
            products,
            image_cache
        )

        is_valid, message = validate_xml(
            catalog_content,
            "rss"
        )

        if not is_valid:
            logger.error(
                f"Catalog validation failed: {message}"
            )
            return 1

        logger.info(
            f"Catalog feed generated with {catalog_count} items"
        )

        logger.info(
            "Catalog feed validation: PASSED ✓"
        )

        logger.info("")

        logger.info(
            "STEP 4: Writing feeds to disk..."
        )

        rss_written = write_feed_file(
            Config.RSS_FILE,
            rss_content
        )

        catalog_written = write_feed_file(
            Config.CATALOG_FILE,
            catalog_content
        )

        if not (rss_written and catalog_written):
            logger.error(
                "Failed to write one or more feed files"
            )
            return 1

        logger.info("")

        logger.info("=" * 70)
        logger.info("GENERATION COMPLETE")
        logger.info("=" * 70)

        logger.info(
            f"RSS File: {Config.RSS_FILE} ({rss_count} items)"
        )

        logger.info(
            f"Catalog File: {Config.CATALOG_FILE} ({catalog_count} items)"
        )

        logger.info(
            f"Total products processed: {len(products)}"
        )

        logger.info(
            f"Image metadata cache: {len(image_cache.cache)} entries"
        )

        logger.info("=" * 70)
        logger.info("")

        return 0

    except Exception as e:
        logger.error(
            f"Fatal error: {e}",
            exc_info=True
        )

        return 1


if __name__ == "__main__":
    sys.exit(main())
