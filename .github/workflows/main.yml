name: Update Shopify RSS Feed and Catalog

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feeds:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate RSS and Pinterest catalog XML
        env:
          SHOPIFY_STORE: https://rawayatluxe.com
        run: |
          python3 - <<'PY'
          import html
          import json
          import re
          from datetime import datetime, timezone
          from decimal import Decimal, InvalidOperation
          from email.utils import format_datetime
          from urllib.request import Request, urlopen
          from urllib.parse import urlparse
          from xml.etree.ElementTree import Element, SubElement, ElementTree, register_namespace

          STORE = "https://rawayatluxe.com"
          CURRENCY = "PKR"
          BRAND = "Rawayat"
          G_NS = "http://base.google.com/ns/1.0"
          register_namespace("g", G_NS)

          def clean(value):
              value = str(value or "")
              value = re.sub(r"(?is)<(script|style)\b[^>]*>.*?</\1>", " ", value)
              value = re.sub(r"(?s)<[^>]+>", " ", value)
              value = html.unescape(value)
              return re.sub(r"\s+", " ", value).strip()

          def add(parent, tag, value):
              node = SubElement(parent, tag)
              node.text = str(value)
              return node

          def add_g(parent, tag, value):
              return add(parent, "{" + G_NS + "}" + tag, value)

          def get_products():
              products = []
              seen_ids = set()
              for page in range(1, 101):
                  url = f"{STORE}/products.json?limit=250&page={page}"
                  request = Request(url, headers={
                      "User-Agent": "Rawayat-Pinterest-Feed/4.0",
                      "Accept": "application/json"
                  })
                  with urlopen(request, timeout=60) as response:
                      batch = json.load(response).get("products", [])
                  if not batch:
                      break
                  added = 0
                  for product in batch:
                      pid = str(product.get("id", "")).strip()
                      if pid and pid not in seen_ids:
                          seen_ids.add(pid)
                          products.append(product)
                          added += 1
                  if added == 0 or len(batch) < 250:
                      break
              if not products:
                  raise RuntimeError("Shopify returned zero products; feeds were not replaced.")
              return products

          def product_data(product):
              images = product.get("images") or []
              if not images or not images[0].get("src"):
                  return None

              pid = str(product.get("id", "")).strip()
              handle = str(product.get("handle", "")).strip()
              title = clean(product.get("title", ""))[:500]
              description = clean(product.get("body_html", ""))[:10000]
              if not pid or not handle or not title or not description:
                  return None

              variants = product.get("variants") or []
              available_variants = [v for v in variants if v.get("available", True)]
              variant = (available_variants or variants or [{}])[0]
              try:
                  price = Decimal(str(variant.get("price", ""))).quantize(Decimal("0.01"))
              except (InvalidOperation, ValueError):
                  return None
              if price <= 0:
                  return None

              tags = product.get("tags") or ""
              if isinstance(tags, list):
                  tags = ",".join(str(t) for t in tags)
              if "preorder" in str(tags).lower():
                  availability = "preorder"
              elif available_variants:
                  availability = "in stock"
              else:
                  availability = "out of stock"

              image = str(images[0].get("src", "")).strip()
              link = f"{STORE}/products/{handle}"
              product_type = clean(product.get("product_type", ""))
              pub_date = product.get("published_at")
              try:
                  dt = datetime.fromisoformat(pub_date.replace("Z", "+00:00"))
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)
              except (ValueError, AttributeError):
                  dt = datetime.now(timezone.utc)

              return {
                  "id": pid,
                  "title": title,
                  "description": description,
                  "rss_description": description[:790],
                  "link": link,
                  "image": image,
                  "price": f"{price:.2f} {CURRENCY}",
                  "availability": availability,
                  "product_type": product_type,
                  "pub_date": format_datetime(dt.astimezone(timezone.utc)),
              }

          def make_root(title, description):
              root = Element("rss", {"version": "2.0"})
              channel = SubElement(root, "channel")
              add(channel, "title", title)
              add(channel, "link", STORE)
              add(channel, "description", description)
              add(channel, "language", "en-us")
              return root, channel

          def add_common_google_fields(item, p, full_description=False):
              add_g(item, "id", p["id"])
              # Keep the product/group ID aligned with the Shopify product ID.
              add_g(item, "item_group_id", p["id"])
              add_g(item, "title", p["title"])
              add_g(item, "link", p["link"])
              add_g(item, "image_link", p["image"])
              add_g(item, "brand", BRAND)
              add_g(item, "condition", "new")
              add_g(item, "price", p["price"])
              add_g(item, "availability", p["availability"])
              if p["product_type"]:
                  add_g(item, "product_type", p["product_type"])
              add_g(item, "description", p["description"] if full_description else p["rss_description"])

          products = get_products()
          rss_root, rss_channel = make_root(
              "Rawayat Luxe", "Pakistani luxury fashion by Rawayat Luxe"
          )
          catalog_root, catalog_channel = make_root(
              "Rawayat Luxe Product Catalog", "Product catalog for Rawayat Luxe"
          )

          count = 0
          skipped = 0
          for product in products:
              p = product_data(product)
              if p is None:
                  skipped += 1
                  continue

              # RSS: one entry and one primary image per product.
              rss_item = SubElement(rss_channel, "item")
              add(rss_item, "title", p["title"][:100])
              add(rss_item, "link", p["link"])
              add(rss_item, "guid", p["id"]).set("isPermaLink", "false")
              add(rss_item, "description", p["rss_description"])
              add(rss_item, "pubDate", p["pub_date"])
              mime = "image/jpeg"
              image_path = urlparse(p["image"]).path.lower()
              if image_path.endswith(".png"):
                  mime = "image/png"
              elif image_path.endswith(".webp"):
                  mime = "image/webp"
              SubElement(rss_item, "enclosure", {
                  "url": p["image"], "type": mime, "length": "0"
              })
              add_common_google_fields(rss_item, p, full_description=False)

              # Catalog: include every required Pinterest retail-catalog field.
              catalog_item = SubElement(catalog_channel, "item")
              add_common_google_fields(catalog_item, p, full_description=True)
              count += 1

          if count == 0:
              raise RuntimeError("No valid products found; feeds were not replaced.")

          ElementTree(rss_root).write("rss.xml", encoding="utf-8", xml_declaration=True)
          ElementTree(catalog_root).write("catalog.xml", encoding="utf-8", xml_declaration=True)
          print(f"Generated rss.xml and catalog.xml for {count} products.")
          print(f"Skipped {skipped} products with missing images, descriptions, IDs, or valid prices.")
          print("Only the first product image is used; no additional image fields are included.")
          PY

      - name: Commit updated feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rss.xml catalog.xml
          if git diff --cached --quiet; then
            echo "No feed changes to commit."
          else
            git commit -m "Update Pinterest RSS and catalog feeds"
            git push
          fi
